name: Build PanVK WSI Test APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Generate diagnostic Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/panvkwsi app/src/main/cpp

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PanVK-WSI-Test"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.panvkwsi'
              compileSdk 35
              ndkVersion '27.2.12479018'

              defaultConfig {
                  applicationId 'com.example.panvkwsi'
                  minSdk 26
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'

                  externalNativeBuild {
                      cmake {
                          cppFlags '-std=c++17 -Wall -Wextra'
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path 'src/main/cpp/CMakeLists.txt'
                      version '3.22.1'
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.vulkan.version"
                  android:version="0x00400000"
                  android:required="false" />

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="PanVK WSI Test"
                  android:hasCode="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/panvkwsi/MainActivity.java <<'EOF'
          package com.example.panvkwsi;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Surface;
          import android.view.SurfaceHolder;
          import android.view.SurfaceView;
          import android.widget.TextView;
          import android.widget.LinearLayout;
          import android.graphics.Color;

          public class MainActivity extends Activity implements SurfaceHolder.Callback {

              static {
                  System.loadLibrary("panvkwsi");
              }

              private TextView status;
              private boolean started = false;

              private native String testSurface(Surface surface);

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  getWindow().getDecorView().setSystemUiVisibility(
                      5894 | 1024 | 512
                  );

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(20, 20, 20));

                  status = new TextView(this);
                  status.setTextColor(Color.WHITE);
                  status.setTextSize(16);
                  status.setPadding(24, 24, 24, 24);
                  status.setText(
                      "PanVK WSI Test\nОжидание Android Surface..."
                  );

                  root.addView(
                      status,
                      new LinearLayout.LayoutParams(-1, -2)
                  );

                  SurfaceView view = new SurfaceView(this);

                  root.addView(
                      view,
                      new LinearLayout.LayoutParams(-1, 0, 1)
                  );

                  setContentView(root);
                  view.getHolder().addCallback(this);
              }

              @Override
              public void surfaceCreated(SurfaceHolder holder) {
                  if (started) return;

                  started = true;

                  status.setText(
                      "Выполняется Vulkan-тест...\n" +
                      "Подробности: adb logcat -s PanVK_WSI_TEST"
                  );

                  Surface surface = holder.getSurface();

                  new Thread(() -> {
                      String result = testSurface(surface);

                      runOnUiThread(() -> status.setText(result));
                  }).start();
              }

              @Override
              public void surfaceChanged(
                  SurfaceHolder holder,
                  int format,
                  int width,
                  int height
              ) {}

              @Override
              public void surfaceDestroyed(SurfaceHolder holder) {}
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(panvkwsi)

          add_library(panvkwsi SHARED native-lib.cpp)

          find_library(log-lib log)
          find_library(android-lib android)

          target_link_libraries(
              panvkwsi
              ${log-lib}
              ${android-lib}
              vulkan
          )
          EOF

          cat > app/src/main/cpp/native-lib.cpp <<'EOF'
          #include <jni.h>
          #include <android/native_window_jni.h>

          #define VK_USE_PLATFORM_ANDROID_KHR
          #include <vulkan/vulkan.h>
          #include <android/log.h>

          #include <vector>
          #include <string>
          #include <sstream>
          #include <algorithm>
          #include <cstdint>

          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "PanVK_WSI_TEST", __VA_ARGS__)

          static void say(std::ostringstream& out, const std::string& message) {
              out << message << "\n";
              LOGI("%s", message.c_str());
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_example_panvkwsi_MainActivity_testSurface(
              JNIEnv* env,
              jobject,
              jobject surface
          ) {
              std::ostringstream out;

              VkInstance instance = VK_NULL_HANDLE;
              VkDevice device = VK_NULL_HANDLE;
              VkSurfaceKHR vkSurface = VK_NULL_HANDLE;
              VkSwapchainKHR swapchain = VK_NULL_HANDLE;

              VkSemaphore acquired = VK_NULL_HANDLE;
              VkSemaphore rendered = VK_NULL_HANDLE;
              VkCommandPool pool = VK_NULL_HANDLE;

              ANativeWindow* window =
                  ANativeWindow_fromSurface(env, surface);

              if (!window) {
                  return env->NewStringUTF(
                      "ОШИБКА: ANativeWindow_fromSurface"
                  );
              }

              auto fail = [&](const char* where, VkResult result) {
                  std::ostringstream message;
                  message << "ОШИБКА " << where
                          << ": VkResult=" << static_cast<int>(result);
                  say(out, message.str());
              };

              bool passed = false;

              do {
                  VkApplicationInfo appInfo{};
                  appInfo.sType =
                      VK_STRUCTURE_TYPE_APPLICATION_INFO;
                  appInfo.pApplicationName = "PanVK WSI Test";
                  appInfo.apiVersion = VK_API_VERSION_1_0;

                  const char* instanceExtensions[] = {
                      VK_KHR_SURFACE_EXTENSION_NAME,
                      VK_KHR_ANDROID_SURFACE_EXTENSION_NAME
                  };

                  VkInstanceCreateInfo instanceInfo{};
                  instanceInfo.sType =
                      VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO;
                  instanceInfo.pApplicationInfo = &appInfo;
                  instanceInfo.enabledExtensionCount = 2;
                  instanceInfo.ppEnabledExtensionNames =
                      instanceExtensions;

                  VkResult r = vkCreateInstance(
                      &instanceInfo,
                      nullptr,
                      &instance
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkCreateInstance", r);
                      break;
                  }

                  uint32_t physicalCount = 0;

                  r = vkEnumeratePhysicalDevices(
                      instance,
                      &physicalCount,
                      nullptr
                  );

                  if (r != VK_SUCCESS || physicalCount == 0) {
                      say(out, "ОШИБКА: Vulkan GPU не найдены");
                      break;
                  }

                  std::vector<VkPhysicalDevice> physicalDevices(
                      physicalCount
                  );

                  r = vkEnumeratePhysicalDevices(
                      instance,
                      &physicalCount,
                      physicalDevices.data()
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkEnumeratePhysicalDevices", r);
                      break;
                  }

                  VkPhysicalDevice physicalDevice =
                      physicalDevices[0];

                  VkPhysicalDeviceProperties properties{};
                  vkGetPhysicalDeviceProperties(
                      physicalDevice,
                      &properties
                  );

                  say(
                      out,
                      std::string("GPU: ") + properties.deviceName
                  );

                  VkAndroidSurfaceCreateInfoKHR surfaceInfo{};
                  surfaceInfo.sType =
                      VK_STRUCTURE_TYPE_ANDROID_SURFACE_CREATE_INFO_KHR;
                  surfaceInfo.window = window;

                  r = vkCreateAndroidSurfaceKHR(
                      instance,
                      &surfaceInfo,
                      nullptr,
                      &vkSurface
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkCreateAndroidSurfaceKHR", r);
                      break;
                  }

                  uint32_t queueCount = 0;

                  vkGetPhysicalDeviceQueueFamilyProperties(
                      physicalDevice,
                      &queueCount,
                      nullptr
                  );

                  std::vector<VkQueueFamilyProperties> queueProperties(
                      queueCount
                  );

                  vkGetPhysicalDeviceQueueFamilyProperties(
                      physicalDevice,
                      &queueCount,
                      queueProperties.data()
                  );

                  uint32_t queueFamily = UINT32_MAX;

                  for (uint32_t i = 0; i < queueCount; ++i) {
                      if (queueProperties[i].queueCount == 0) {
                          continue;
                      }

                      if (!(queueProperties[i].queueFlags &
                            VK_QUEUE_GRAPHICS_BIT)) {
                          continue;
                      }

                      VkBool32 supportsPresent = VK_FALSE;

                      r = vkGetPhysicalDeviceSurfaceSupportKHR(
                          physicalDevice,
                          i,
                          vkSurface,
                          &supportsPresent
                      );

                      if (r == VK_SUCCESS && supportsPresent) {
                          queueFamily = i;
                          break;
                      }
                  }

                  if (queueFamily == UINT32_MAX) {
                      say(
                          out,
                          "ОШИБКА: нет Graphics + Present queue"
                      );
                      break;
                  }

                  say(out, "Graphics + Present queue: FOUND");

                  uint32_t formatCount = 0;

                  r = vkGetPhysicalDeviceSurfaceFormatsKHR(
                      physicalDevice,
                      vkSurface,
                      &formatCount,
                      nullptr
                  );

                  if (r != VK_SUCCESS || formatCount == 0) {
                      fail("vkGetPhysicalDeviceSurfaceFormatsKHR", r);
                      break;
                  }

                  std::vector<VkSurfaceFormatKHR> formats(formatCount);

                  r = vkGetPhysicalDeviceSurfaceFormatsKHR(
                      physicalDevice,
                      vkSurface,
                      &formatCount,
                      formats.data()
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkGetPhysicalDeviceSurfaceFormatsKHR", r);
                      break;
                  }

                  VkSurfaceFormatKHR chosen = formats[0];

                  if (formats.size() == 1 &&
                      formats[0].format == VK_FORMAT_UNDEFINED) {
                      chosen.format = VK_FORMAT_R8G8B8A8_UNORM;
                  } else {
                      for (const auto& format : formats) {
                          if (
                              format.format == VK_FORMAT_R8G8B8A8_UNORM ||
                              format.format == VK_FORMAT_B8G8R8A8_UNORM
                          ) {
                              chosen = format;
                              break;
                          }
                      }
                  }

                  {
                      std::ostringstream message;
                      message << "Surface formats: " << formatCount
                              << ", selected format=" << chosen.format
                              << ", colorspace=" << chosen.colorSpace;
                      say(out, message.str());
                  }

                  VkSurfaceCapabilitiesKHR caps{};

                  r = vkGetPhysicalDeviceSurfaceCapabilitiesKHR(
                      physicalDevice,
                      vkSurface,
                      &caps
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkGetPhysicalDeviceSurfaceCapabilitiesKHR", r);
                      break;
                  }

                  uint32_t modeCount = 0;

                  r = vkGetPhysicalDeviceSurfacePresentModesKHR(
                      physicalDevice,
                      vkSurface,
                      &modeCount,
                      nullptr
                  );

                  if (r != VK_SUCCESS || modeCount == 0) {
                      fail("vkGetPhysicalDeviceSurfacePresentModesKHR", r);
                      break;
                  }

                  std::vector<VkPresentModeKHR> modes(modeCount);

                  r = vkGetPhysicalDeviceSurfacePresentModesKHR(
                      physicalDevice,
                      vkSurface,
                      &modeCount,
                      modes.data()
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkGetPhysicalDeviceSurfacePresentModesKHR", r);
                      break;
                  }

                  bool fifoSupported = std::find(
                      modes.begin(),
                      modes.end(),
                      VK_PRESENT_MODE_FIFO_KHR
                  ) != modes.end();

                  say(
                      out,
                      std::string("FIFO present mode: ") +
                      (fifoSupported ? "YES" : "NO")
                  );

                  if (!fifoSupported) {
                      say(out, "ОШИБКА: FIFO отсутствует");
                      break;
                  }

                  VkImageUsageFlags usage = 0;

                  const VkImageUsageFlags candidates[] = {
                      VK_IMAGE_USAGE_COLOR_ATTACHMENT_BIT,
                      VK_IMAGE_USAGE_TRANSFER_DST_BIT,
                      VK_IMAGE_USAGE_TRANSFER_SRC_BIT,
                      VK_IMAGE_USAGE_SAMPLED_BIT,
                      VK_IMAGE_USAGE_STORAGE_BIT
                  };

                  for (VkImageUsageFlags candidate : candidates) {
                      if (caps.supportedUsageFlags & candidate) {
                          usage = candidate;
                          break;
                      }
                  }

                  if (usage == 0) {
                      say(out, "ОШИБКА: нет поддерживаемого imageUsage");
                      break;
                  }

                  VkCompositeAlphaFlagBitsKHR alphaModes[] = {
                      VK_COMPOSITE_ALPHA_OPAQUE_BIT_KHR,
                      VK_COMPOSITE_ALPHA_PRE_MULTIPLIED_BIT_KHR,
                      VK_COMPOSITE_ALPHA_POST_MULTIPLIED_BIT_KHR,
                      VK_COMPOSITE_ALPHA_INHERIT_BIT_KHR
                  };

                  VkCompositeAlphaFlagBitsKHR compositeAlpha =
                      VK_COMPOSITE_ALPHA_OPAQUE_BIT_KHR;

                  bool alphaFound = false;

                  for (auto mode : alphaModes) {
                      if (caps.supportedCompositeAlpha & mode) {
                          compositeAlpha = mode;
                          alphaFound = true;
                          break;
                      }
                  }

                  if (!alphaFound) {
                      say(out, "ОШИБКА: нет compositeAlpha");
                      break;
                  }

                  float priority = 1.0f;

                  VkDeviceQueueCreateInfo queueInfo{};
                  queueInfo.sType =
                      VK_STRUCTURE_TYPE_DEVICE_QUEUE_CREATE_INFO;
                  queueInfo.queueFamilyIndex = queueFamily;
                  queueInfo.queueCount = 1;
                  queueInfo.pQueuePriorities = &priority;

                  const char* deviceExtensions[] = {
                      VK_KHR_SWAPCHAIN_EXTENSION_NAME
                  };

                  VkDeviceCreateInfo deviceInfo{};
                  deviceInfo.sType =
                      VK_STRUCTURE_TYPE_DEVICE_CREATE_INFO;
                  deviceInfo.queueCreateInfoCount = 1;
                  deviceInfo.pQueueCreateInfos = &queueInfo;
                  deviceInfo.enabledExtensionCount = 1;
                  deviceInfo.ppEnabledExtensionNames = deviceExtensions;

                  r = vkCreateDevice(
                      physicalDevice,
                      &deviceInfo,
                      nullptr,
                      &device
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkCreateDevice", r);
                      break;
                  }

                  VkQueue queue = VK_NULL_HANDLE;

                  vkGetDeviceQueue(
                      device,
                      queueFamily,
                      0,
                      &queue
                  );

                  VkExtent2D extent = caps.currentExtent;

                  if (extent.width == UINT32_MAX) {
                      extent.width = static_cast<uint32_t>(
                          ANativeWindow_getWidth(window)
                      );

                      extent.height = static_cast<uint32_t>(
                          ANativeWindow_getHeight(window)
                      );

                      extent.width = std::max(
                          caps.minImageExtent.width,
                          std::min(
                              extent.width,
                              caps.maxImageExtent.width
                          )
                      );

                      extent.height = std::max(
                          caps.minImageExtent.height,
                          std::min(
                              extent.height,
                              caps.maxImageExtent.height
                          )
                      );
                  }

                  uint32_t imageCount = caps.minImageCount + 1;

                  if (
                      caps.maxImageCount > 0 &&
                      imageCount > caps.maxImageCount
                  ) {
                      imageCount = caps.maxImageCount;
                  }

                  VkSwapchainCreateInfoKHR swapInfo{};
                  swapInfo.sType =
                      VK_STRUCTURE_TYPE_SWAPCHAIN_CREATE_INFO_KHR;
                  swapInfo.surface = vkSurface;
                  swapInfo.minImageCount = imageCount;
                  swapInfo.imageFormat = chosen.format;
                  swapInfo.imageColorSpace = chosen.colorSpace;
                  swapInfo.imageExtent = extent;
                  swapInfo.imageArrayLayers = 1;
                  swapInfo.imageUsage = usage;
                  swapInfo.imageSharingMode = VK_SHARING_MODE_EXCLUSIVE;
                  swapInfo.preTransform = caps.currentTransform;
                  swapInfo.compositeAlpha = compositeAlpha;
                  swapInfo.presentMode = VK_PRESENT_MODE_FIFO_KHR;
                  swapInfo.clipped = VK_TRUE;

                  {
                      std::ostringstream message;
                      message << "Swapchain request: "
                              << extent.width << "x" << extent.height
                              << ", images=" << imageCount
                              << ", usage=" << usage;
                      say(out, message.str());
                  }

                  r = vkCreateSwapchainKHR(
                      device,
                      &swapInfo,
                      nullptr,
                      &swapchain
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkCreateSwapchainKHR", r);
                      break;
                  }

                  say(out, "vkCreateSwapchainKHR: SUCCESS");

                  uint32_t actualImageCount = 0;

                  r = vkGetSwapchainImagesKHR(
                      device,
                      swapchain,
                      &actualImageCount,
                      nullptr
                  );

                  if (r != VK_SUCCESS || actualImageCount == 0) {
                      fail("vkGetSwapchainImagesKHR", r);
                      break;
                  }

                  std::vector<VkImage> images(actualImageCount);

                  r = vkGetSwapchainImagesKHR(
                      device,
                      swapchain,
                      &actualImageCount,
                      images.data()
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkGetSwapchainImagesKHR", r);
                      break;
                  }

                  VkSemaphoreCreateInfo semaphoreInfo{};
                  semaphoreInfo.sType =
                      VK_STRUCTURE_TYPE_SEMAPHORE_CREATE_INFO;

                  r = vkCreateSemaphore(
                      device,
                      &semaphoreInfo,
                      nullptr,
                      &acquired
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkCreateSemaphore(acquired)", r);
                      break;
                  }

                  r = vkCreateSemaphore(
                      device,
                      &semaphoreInfo,
                      nullptr,
                      &rendered
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkCreateSemaphore(rendered)", r);
                      break;
                  }

                  VkCommandPoolCreateInfo poolInfo{};
                  poolInfo.sType =
                      VK_STRUCTURE_TYPE_COMMAND_POOL_CREATE_INFO;
                  poolInfo.queueFamilyIndex = queueFamily;
                  poolInfo.flags =
                      VK_COMMAND_POOL_CREATE_RESET_COMMAND_BUFFER_BIT;

                  r = vkCreateCommandPool(
                      device,
                      &poolInfo,
                      nullptr,
                      &pool
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkCreateCommandPool", r);
                      break;
                  }

                  VkCommandBuffer commandBuffer = VK_NULL_HANDLE;

                  VkCommandBufferAllocateInfo allocInfo{};
                  allocInfo.sType =
                      VK_STRUCTURE_TYPE_COMMAND_BUFFER_ALLOCATE_INFO;
                  allocInfo.commandPool = pool;
                  allocInfo.level = VK_COMMAND_BUFFER_LEVEL_PRIMARY;
                  allocInfo.commandBufferCount = 1;

                  r = vkAllocateCommandBuffers(
                      device,
                      &allocInfo,
                      &commandBuffer
                  );

                  if (r != VK_SUCCESS) {
                      fail("vkAllocateCommandBuffers", r);
                      break;
                  }

                  bool cyclesPassed = true;

                  for (int i = 0; i < 3; ++i) {
                      uint32_t imageIndex = 0;

                      r = vkAcquireNextImageKHR(
                          device,
                          swapchain,
                          UINT64_MAX,
                          acquired,
                          VK_NULL_HANDLE,
                          &imageIndex
                      );

                      if (
                          r != VK_SUCCESS &&
                          r != VK_SUBOPTIMAL_KHR
                      ) {
                          fail("vkAcquireNextImageKHR", r);
                          cyclesPassed = false;
                          break;
                      }

                      if (imageIndex >= images.size()) {
                          say(out, "ОШИБКА: imageIndex вне диапазона");
                          cyclesPassed = false;
                          break;
                      }

                      r = vkResetCommandBuffer(commandBuffer, 0);

                      if (r != VK_SUCCESS) {
                          fail("vkResetCommandBuffer", r);
                          cyclesPassed = false;
                          break;
                      }

                      VkCommandBufferBeginInfo beginInfo{};
                      beginInfo.sType =
                          VK_STRUCTURE_TYPE_COMMAND_BUFFER_BEGIN_INFO;
                      beginInfo.flags =
                          VK_COMMAND_BUFFER_USAGE_ONE_TIME_SUBMIT_BIT;

                      r = vkBeginCommandBuffer(
                          commandBuffer,
                          &beginInfo
                      );

                      if (r != VK_SUCCESS) {
                          fail("vkBeginCommandBuffer", r);
                          cyclesPassed = false;
                          break;
                      }

                      VkImageMemoryBarrier barrier{};
                      barrier.sType =
                          VK_STRUCTURE_TYPE_IMAGE_MEMORY_BARRIER;
                      barrier.oldLayout = VK_IMAGE_LAYOUT_UNDEFINED;
                      barrier.newLayout = VK_IMAGE_LAYOUT_PRESENT_SRC_KHR;
                      barrier.srcQueueFamilyIndex =
                          VK_QUEUE_FAMILY_IGNORED;
                      barrier.dstQueueFamilyIndex =
                          VK_QUEUE_FAMILY_IGNORED;
                      barrier.image = images[imageIndex];
                      barrier.subresourceRange.aspectMask =
                          VK_IMAGE_ASPECT_COLOR_BIT;
                      barrier.subresourceRange.baseMipLevel = 0;
                      barrier.subresourceRange.levelCount = 1;
                      barrier.subresourceRange.baseArrayLayer = 0;
                      barrier.subresourceRange.layerCount = 1;

                      vkCmdPipelineBarrier(
                          commandBuffer,
                          VK_PIPELINE_STAGE_TOP_OF_PIPE_BIT,
                          VK_PIPELINE_STAGE_BOTTOM_OF_PIPE_BIT,
                          0,
                          0, nullptr,
                          0, nullptr,
                          1, &barrier
                      );

                      r = vkEndCommandBuffer(commandBuffer);

                      if (r != VK_SUCCESS) {
                          fail("vkEndCommandBuffer", r);
                          cyclesPassed = false;
                          break;
                      }

                      VkPipelineStageFlags waitStage =
                          VK_PIPELINE_STAGE_TOP_OF_PIPE_BIT;

                      VkSubmitInfo submitInfo{};
                      submitInfo.sType = VK_STRUCTURE_TYPE_SUBMIT_INFO;
                      submitInfo.waitSemaphoreCount = 1;
                      submitInfo.pWaitSemaphores = &acquired;
                      submitInfo.pWaitDstStageMask = &waitStage;
                      submitInfo.commandBufferCount = 1;
                      submitInfo.pCommandBuffers = &commandBuffer;
                      submitInfo.signalSemaphoreCount = 1;
                      submitInfo.pSignalSemaphores = &rendered;

                      r = vkQueueSubmit(
                          queue,
                          1,
                          &submitInfo,
                          VK_NULL_HANDLE
                      );

                      if (r != VK_SUCCESS) {
                          fail("vkQueueSubmit", r);
                          cyclesPassed = false;
                          break;
                      }

                      VkPresentInfoKHR presentInfo{};
                      presentInfo.sType =
                          VK_STRUCTURE_TYPE_PRESENT_INFO_KHR;
                      presentInfo.waitSemaphoreCount = 1;
                      presentInfo.pWaitSemaphores = &rendered;
                      presentInfo.swapchainCount = 1;
                      presentInfo.pSwapchains = &swapchain;
                      presentInfo.pImageIndices = &imageIndex;

                      r = vkQueuePresentKHR(
                          queue,
                          &presentInfo
                      );

                      if (
                          r != VK_SUCCESS &&
                          r != VK_SUBOPTIMAL_KHR
                      ) {
                          fail("vkQueuePresentKHR", r);
                          cyclesPassed = false;
                          break;
                      }

                      vkQueueWaitIdle(queue);

                      std::ostringstream message;
                      message << "Present cycle "
                              << (i + 1)
                              << ": SUCCESS";

                      say(out, message.str());
                  }

                  if (cyclesPassed) {
                      say(
                          out,
                          "RESULT: PASS — swapchain создан, acquire/present прошли."
                      );
                      passed = true;
                  }

              } while (false);

              if (device != VK_NULL_HANDLE) {
                  vkDeviceWaitIdle(device);

                  if (pool != VK_NULL_HANDLE) {
                      vkDestroyCommandPool(
                          device,
                          pool,
                          nullptr
                      );
                  }

                  if (acquired != VK_NULL_HANDLE) {
                      vkDestroySemaphore(
                          device,
                          acquired,
                          nullptr
                      );
                  }

                  if (rendered != VK_NULL_HANDLE) {
                      vkDestroySemaphore(
                          device,
                          rendered,
                          nullptr
                      );
                  }

                  if (swapchain != VK_NULL_HANDLE) {
                      vkDestroySwapchainKHR(
                          device,
                          swapchain,
                          nullptr
                      );
                  }

                  vkDestroyDevice(device, nullptr);
              }

              if (instance != VK_NULL_HANDLE) {
                  if (vkSurface != VK_NULL_HANDLE) {
                      vkDestroySurfaceKHR(
                          instance,
                          vkSurface,
                          nullptr
                      );
                  }

                  vkDestroyInstance(instance, nullptr);
              }

              ANativeWindow_release(window);

              if (!passed && out.str().empty()) {
                  say(out, "ОШИБКА: тест завершился без результата");
              }

              std::string result = out.str();

              return env->NewStringUTF(result.c_str());
          }
          EOF

          cat > README_RU.txt <<'EOF'
          PanVK WSI Test

          Автоматическая сборка APK через GitHub Actions.

          1. Открой Actions.
          2. Запусти Build PanVK WSI Test APK.
          3. Дождись завершения сборки.
          4. Скачай artifact panvk-wsi-test-apk.
          5. Распакуй ZIP и установи app-debug.apk.

          Запусти приложение и дождись результата.

          Для подробного лога:
          adb logcat -s PanVK_WSI_TEST

          Тест проверяет создание Android Vulkan Surface,
          Swapchain, Acquire и Present.
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panvk-wsi-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
